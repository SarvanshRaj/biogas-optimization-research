name: Extract ZIP Archive
on:
  push:
    paths:
      - 'uploads/*.zip'  # Trigger when ZIP is uploaded to /uploads folder

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit extracted files

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          cd uploads
          unzip *.zip -d ../extracted/
          rm *.zip  # Optional: delete the zip after extraction

      - name: Commit extracted files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add extracted/
          git commit -m "Auto-extract ZIP contents" || echo "No changes to commit"
          git push
