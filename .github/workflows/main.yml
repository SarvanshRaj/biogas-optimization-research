name: Auto-extract ZIP
on:
  push:
    paths:
      - '**/*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and clean up
        run: |
          mkdir -p extracted
          for zip in $(find . -name "*.zip"); do
            unzip -o "$zip" -d extracted/
            rm "$zip"
          done
      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extracted/
          git commit -m "Extract ZIP contents" || echo "No changes"
          git push
