[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biogas-optimization-research"
version = "0.1.0"
description = "Simulation-only study of a two-stage food-waste-to-biogas concept (SIMULATED data only)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
    "scipy>=1.17,<2",
    "matplotlib>=3.11,<4",
    "joblib>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "hypothesis>=6.168,<7",
    "ruff>=0.16,<1",
    "mypy>=2.4,<3",
    "scikit-learn-stubs>=0.0.3",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
# Exactly one exclusion, declared rather than hidden: the module entry-point guard, which
# cannot execute under an import-based test runner. Everything else - including argparse
# plumbing and validation error paths - is covered by tests. See docs/tdd_log.md.
exclude_lines = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Hypothesis and pytest idioms read better with long single-line assertions.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# Declared, narrow exceptions - not a global silencing:
#   * scikit-learn is checked with real types via the `scikit-learn-stubs` package (see CI).
#   * joblib and scipy ship no type information in the pinned versions, so calls into them
#     cannot be checked; everything written against them in this project is covered by tests.
module = ["joblib.*", "scipy.*"]
ignore_missing_imports = true
